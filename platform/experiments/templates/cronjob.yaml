# The scheduled regression (scripts/experiment-regression.py): every experiment of the instance, daily, in waves (one
# queue per namespace). Nothing is baked into an image: the job clones the product (the scripts) at product.version
# and the instance (apps/*/experiments) at instance.revision when it starts — the same revisions Argo CD syncs. Image:
# alpine/k8s (kubectl, python3 + PyYAML, git in one pinned upstream image; ~1 GB, pulled once per node).
# Private repositories: the optional Secret git-credentials (key token) is sent as x-access-token on both clones.
# A full run takes hours (experiments of one namespace run one after another, with a cooldown between them). A lab
# that sleeps at the scheduled time (a laptop running kind) runs it when it wakes (startingDeadlineSeconds), or the run
# is missed and SLOExperimentRegressionStale says so after 2 days.
# The lab guard is the runner's: it exits before any fault unless every node is labelled slo-platform/lab=true.
# By hand: kubectl -n slo-experiments create job --from=cronjob/experiment-regression regression-$(date +%s)
{{- if not .Values.instance.repo }}{{ fail "instance.repo: required (the repository with apps/*/experiments)" }}{{ end }}
apiVersion: batch/v1
kind: CronJob
metadata: { name: experiment-regression, namespace: slo-experiments }
spec:
  schedule: {{ .Values.schedule | quote }}
  timeZone: {{ .Values.timeZone | quote }}
  startingDeadlineSeconds: 21600
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 0                  # a second attempt would start the faults all over again: next day
      activeDeadlineSeconds: 50400     # 14 h; on SIGTERM every running fault is removed (terminationGracePeriodSeconds)
      template:
        spec:
          serviceAccountName: experiment-runner
          restartPolicy: Never
          terminationGracePeriodSeconds: 180
          securityContext: { runAsNonRoot: true, runAsUser: 65534, runAsGroup: 65534, seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: regression
              image: alpine/k8s:1.36.5
              command:
                - sh
                - -c
                - |
                  set -e
                  clone() {   # <repo> <ref> <dir>; the token (if any) only as a header of this one command, never in a URL
                    if [ -n "$GIT_TOKEN" ]; then
                      auth=$(printf 'x-access-token:%s' "$GIT_TOKEN" | base64 | tr -d '\n')
                      git -c http.extraHeader="Authorization: Basic $auth" clone -q --depth 1 --branch "$2" "$1" "$3"
                    else
                      git clone -q --depth 1 --branch "$2" "$1" "$3"
                    fi
                    echo "$1 $2 $(git -C "$3" rev-parse --short HEAD)"
                  }
                  clone "$PRODUCT_REPO" "$PRODUCT_VERSION" /tmp/product
                  clone "$INSTANCE_REPO" "$INSTANCE_REVISION" /tmp/instance
                  cd /tmp/product
                  exec python3 -I -B scripts/experiment-regression.py --record slo-experiments/experiment-results \
                    '/tmp/instance/apps/*/experiments'
              env:
                - { name: PRODUCT_REPO, value: {{ .Values.product.repo | quote }} }
                - { name: PRODUCT_VERSION, value: {{ .Values.product.version | toString | quote }} }
                - { name: INSTANCE_REPO, value: {{ .Values.instance.repo | quote }} }
                - { name: INSTANCE_REVISION, value: {{ .Values.instance.revision | toString | quote }} }
                - name: GIT_TOKEN
                  valueFrom: { secretKeyRef: { name: {{ .Values.gitCredentialsSecret | quote }}, key: token, optional: true } }
                - { name: HOME, value: /tmp }
                - { name: PYTHONUNBUFFERED, value: "1" }
              resources:
                requests: { cpu: 20m, memory: 64Mi }
                limits: { memory: 256Mi }
              securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
              volumeMounts: [{ name: tmp, mountPath: /tmp }]
          volumes: [{ name: tmp, emptyDir: { sizeLimit: 256Mi } }]
