# The scheduled fault-experiment regression (lab clusters only: the runner refuses to start unless every node carries
# the label slo-platform/lab=true). Every experiment runs daily (cronjob.yaml), its result becomes metrics
# (exporter.yaml: slo_experiment_*), and a ticket says when it fails or stops running (rules.yaml). Runner rights:
# rbac.yaml here (cluster-wide and its own namespace); per application namespace from the slo chart (platform/slo).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [rbac.yaml, cronjob.yaml, exporter.yaml, rules.yaml]   # namespace slo-experiments (+ a Role in monitoring)
configMapGenerator:
  - name: experiment-exporter
    namespace: slo-experiments
    files: [exporter.py]
