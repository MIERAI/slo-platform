# Images must be pinned (tag = commit or digest): 'latest' / untagged images make rollbacks and audits meaningless.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: { name: disallow-latest-tag }
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector: { matchExpressions: [{ key: slo-platform/app, operator: Exists }] }
    resourceRules:
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods] }
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, c.image.matches('@sha256:[a-f0-9]{64}$') ||
          (c.image.matches(':[^/:]+$') && !c.image.endsWith(':latest')))
      messageExpression: >-
        'pin the image to a tag or digest (not latest / untagged): ' +
        variables.containers.filter(c, !(c.image.matches('@sha256:[a-f0-9]{64}$') ||
          (c.image.matches(':[^/:]+$') && !c.image.endsWith(':latest')))).map(c, c.image).join(', ')

---
# Every container declares cpu/memory requests (scheduling) and a memory limit (one leak cannot take the node).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: { name: require-resources }
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector: { matchExpressions: [{ key: slo-platform/app, operator: Exists }] }
    resourceRules:
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods] }
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
  validations:
    - expression: >-
        variables.containers.all(c, has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)
      messageExpression: >-
        'set resources.requests.cpu/memory and resources.limits.memory on: ' +
        variables.containers.filter(c, !(has(c.resources) &&
          has(c.resources.requests) && 'cpu' in c.resources.requests && 'memory' in c.resources.requests &&
          has(c.resources.limits) && 'memory' in c.resources.limits)).map(c, c.name).join(', ')

---
# Long-running workloads need a readiness probe: rolling updates and canaries only shift traffic to Pods that are ready.
# Job Pods are excluded (they run to completion and receive no traffic).
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: { name: require-readiness-probe }
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector: { matchExpressions: [{ key: slo-platform/app, operator: Exists }] }
    resourceRules:
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods] }
  matchConditions:
    - name: not-a-job-pod
      expression: "!has(object.metadata.ownerReferences) || !object.metadata.ownerReferences.exists(o, o.kind == 'Job')"
  autogen:
    podControllers: { controllers: [deployments, statefulsets, daemonsets] }
  validations:
    - expression: object.spec.containers.all(c, has(c.readinessProbe))
      messageExpression: >-
        'add a readinessProbe to: ' + object.spec.containers.filter(c, !has(c.readinessProbe)).map(c, c.name).join(', ')

---
# Containers run as a non-root user and cannot gain privileges.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata: { name: require-non-root }
spec:
  validationActions: [Deny]
  matchConstraints:
    namespaceSelector: { matchExpressions: [{ key: slo-platform/app, operator: Exists }] }
    resourceRules:
      - { apiGroups: [""], apiVersions: [v1], operations: [CREATE, UPDATE], resources: [pods] }
  variables:
    - name: containers
      expression: "object.spec.containers + (has(object.spec.initContainers) ? object.spec.initContainers : [])"
    - name: podNonRoot
      expression: "has(object.spec.securityContext) && has(object.spec.securityContext.runAsNonRoot) && object.spec.securityContext.runAsNonRoot"
  validations:
    - expression: >-
        variables.containers.all(c, (has(c.securityContext) && has(c.securityContext.runAsNonRoot))
          ? c.securityContext.runAsNonRoot : variables.podNonRoot)
      messageExpression: >-
        'set securityContext.runAsNonRoot: true (Pod or container) for: ' +
        variables.containers.filter(c, !((has(c.securityContext) && has(c.securityContext.runAsNonRoot))
          ? c.securityContext.runAsNonRoot : variables.podNonRoot)).map(c, c.name).join(', ')
    - expression: >-
        variables.containers.all(c, has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
          !c.securityContext.allowPrivilegeEscalation)
      messageExpression: >-
        'set securityContext.allowPrivilegeEscalation: false on: ' +
        variables.containers.filter(c, !(has(c.securityContext) && has(c.securityContext.allowPrivilegeEscalation) &&
          !c.securityContext.allowPrivilegeEscalation)).map(c, c.name).join(', ')
