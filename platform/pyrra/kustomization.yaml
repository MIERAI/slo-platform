# Pyrra v0.10.2 (pyrra-dev/pyrra examples/kubernetes/manifests, trimmed): SLOs as ServiceLevelObjective objects →
# recording rules + multi-window burn-rate alerts (PrometheusRule, picked up by Prometheus), and a UI of every SLO's
# error budget. Applications do not write these objects: they declare slos in app.yaml and the platform renders them
# (platform/slo chart, the ApplicationSet of platform/root).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: monitoring
labels:
  - pairs: { app.kubernetes.io/name: pyrra }   # also in selectors: "component: api" alone is not unique in monitoring
    includeSelectors: true
resources: [crd.yaml, operator.yaml, api.yaml, slis.yaml]   # slis.yaml: platform-wide SLI recording rules
images:
  - { name: ghcr.io/pyrra-dev/pyrra, newTag: v0.10.2 }
