# The operator: ServiceLevelObjective → PrometheusRule in the same namespace (generic rules: pyrra_* series for
# dashboards); also serves the objectives to the API (:9444).
apiVersion: v1
kind: ServiceAccount
metadata: { name: pyrra-kubernetes }
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata: { name: pyrra-kubernetes }
rules:
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [monitoring.coreos.com]
    resources: [prometheusrules/status]
    verbs: [get]
  - apiGroups: [pyrra.dev]
    resources: [servicelevelobjectives]
    verbs: [create, delete, get, list, patch, update, watch]
  - apiGroups: [pyrra.dev]
    resources: [servicelevelobjectives/status]
    verbs: [get, patch, update]
  - apiGroups: [pyrra.dev]
    resources: [servicelevelobjectives/finalizers]
    verbs: [update]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata: { name: pyrra-kubernetes }
roleRef: { apiGroup: rbac.authorization.k8s.io, kind: ClusterRole, name: pyrra-kubernetes }
subjects: [{ kind: ServiceAccount, name: pyrra-kubernetes, namespace: monitoring }]
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: pyrra-kubernetes }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: kubernetes } }
  template:
    metadata: { labels: { app.kubernetes.io/component: kubernetes } }
    spec:
      serviceAccountName: pyrra-kubernetes
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: pyrra
          image: ghcr.io/pyrra-dev/pyrra
          args: [kubernetes, --generic-rules]
          ports: [{ containerPort: 8080, name: metrics }, { containerPort: 9444, name: http }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: pyrra-kubernetes }
spec:
  selector: { app.kubernetes.io/component: kubernetes }
  ports: [{ name: metrics, port: 8080, targetPort: 8080 }, { name: http, port: 9444, targetPort: 9444 }]
