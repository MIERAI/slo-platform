# The UI / API: every SLO, its error budget and burn rates, read from Prometheus
# (kubectl -n monitoring port-forward svc/pyrra-api 9099).
apiVersion: apps/v1
kind: Deployment
metadata: { name: pyrra-api }
spec:
  replicas: 1
  selector: { matchLabels: { app.kubernetes.io/component: api } }
  template:
    metadata: { labels: { app.kubernetes.io/component: api } }
    spec:
      automountServiceAccountToken: false
      securityContext: { runAsNonRoot: true, runAsUser: 65534, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: pyrra
          image: ghcr.io/pyrra-dev/pyrra
          args:
            - api
            - --api-url=http://pyrra-kubernetes.monitoring.svc:9444
            - --prometheus-url=http://kps-prometheus.monitoring.svc:9090
          ports: [{ containerPort: 9099, name: http }]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
---
apiVersion: v1
kind: Service
metadata: { name: pyrra-api }
spec:
  selector: { app.kubernetes.io/component: api }
  ports: [{ name: http, port: 9099, targetPort: 9099 }]
