# CloudNativePG operator + Barman Cloud plugin, pinned upstream releases.
# The plugin replaces the operator's built-in barmanObjectStore (deprecated, removed in CloudNativePG 1.31).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - https://github.com/cloudnative-pg/cloudnative-pg/releases/download/v1.30.1/cnpg-1.30.1.yaml
  - https://github.com/cloudnative-pg/plugin-barman-cloud/releases/download/v0.15.1/manifest.yaml
