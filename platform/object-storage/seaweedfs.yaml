apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: seaweedfs-data }
spec:
  accessModes: [ReadWriteOnce]
  resources: { requests: { storage: 5Gi } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: seaweedfs }
spec:
  replicas: 1
  strategy: { type: Recreate }   # one writer on the volume
  selector: { matchLabels: { app: seaweedfs } }
  template:
    metadata: { labels: { app: seaweedfs } }
    spec:
      containers:
        - name: seaweedfs
          image: chrislusf/seaweedfs:4.51
          args: [server, -dir=/data, -ip=seaweedfs, -ip.bind=0.0.0.0, -volume.max=0,
                 -s3, -s3.port=8333, -s3.config=/config/s3.json]
          ports:
            - { name: s3, containerPort: 8333 }
            - { name: master, containerPort: 9333 }
            - { name: volume, containerPort: 8080 }
            - { name: filer, containerPort: 8888 }
            - { name: master-grpc, containerPort: 19333 }
            - { name: volume-grpc, containerPort: 18080 }
            - { name: filer-grpc, containerPort: 18888 }
          readinessProbe:
            tcpSocket: { port: s3 }
            periodSeconds: 5
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - { name: data, mountPath: /data }
            - { name: config, mountPath: /config, readOnly: true }
      volumes:
        - { name: data, persistentVolumeClaim: { claimName: seaweedfs-data } }
        - { name: config, secret: { secretName: seaweedfs-s3 } }
---
apiVersion: v1
kind: Service
metadata: { name: seaweedfs }
spec:
  selector: { app: seaweedfs }
  ports:
    - { name: s3, port: 8333 }
    - { name: master, port: 9333 }
    - { name: volume, port: 8080 }
    - { name: filer, port: 8888 }
    - { name: master-grpc, port: 19333 }
    - { name: volume-grpc, port: 18080 }
    - { name: filer-grpc, port: 18888 }
---
# Bucket "cnpg" (idempotent). weed shell exits 0 even when it cannot reach the master, so check its output.
apiVersion: batch/v1
kind: Job
metadata:
  name: bucket
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
spec:
  backoffLimit: 6
  activeDeadlineSeconds: 300
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: bucket
          image: chrislusf/seaweedfs:4.51
          command:
            - sh
            - -c
            - |
              ws() { echo "$1" | weed shell -master=seaweedfs:9333 2>&1; }
              until out=$(ws s3.bucket.list) && ! echo "$out" | grep -q "cannot connect"; do sleep 3; done
              echo "$out" | grep -qE '^\s*cnpg\s' || ws "s3.bucket.create -name cnpg"
              ws s3.bucket.list | grep -E '^\s*cnpg\s'
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { memory: 128Mi }
