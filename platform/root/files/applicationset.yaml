# Every application of the instance (<apps>/<app>/app.yaml in the instance repository, <apps> = platform.yaml
# instance.apps, default apps; reference: docs/app-yaml.md):
# one Argo CD Application per component × environment, named <component>-<env>, deployed into the namespace <name>-<env>.
#   component kustomize: <dir>  → instance repo, path <apps>/<app>/<dir>/<env>
#   component helm: <dir>       → instance repo, chart <apps>/<app>/<dir>/chart, values <apps>/<app>/<dir>/values-<env>.yaml
#   slos                        → component <name>-slo: product repo, chart platform/slo, values {app, env, slos} (Pyrra
#                                 objectives, probes, and the experiment runner's Role / RoleBinding in that namespace)
#   traffic                     → component <name>-traffic: product repo, chart platform/traffic, values {app, env, scale,
#                                 peakRpm, requests, day} (synthetic users); not in environments with trafficScale: 0
# The namespace gets the labels the platform keys on (slo-platform/app, slo-platform/env; slo-platform/image-signatures
# when signedImages) and the annotation that lets the fault experiments target it (Chaos Mesh only injects into
# annotated namespaces), over app.yaml's namespace.labels / namespace.annotations, over platform.yaml's
# applications.namespaceLabels / namespaceAnnotations (filled in below as Go dict expressions). ignoreDifferences
# (app.yaml) is passed through, with RespectIgnoreDifferences. A cluster leaves out the applications its
# clusters.<name>.applications.exclude names (git generator files entries with exclude: true, none without it).
# Rendered by the root chart (templates/applicationset.yaml), which fills in the ${…} placeholders from platform.yaml.
# scripts/render.py (appdesc.applications) renders the same way for validate.sh and the scripts: keep both in step.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: applications
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - matrix:
              generators:
                - git:
                    repoURL: "${INSTANCE_REPO}"
                    revision: "${INSTANCE_REVISION}"
                    files: ${APPS_FILES}   # where app.yaml files live (instance.apps), minus clusters.<name>.applications.exclude
                # prefixed keys: the app, the component and the environment all have a name
                - list:
                    elementsYaml: |
                      {{- range .components }}
                      - component: {{ toJson . }}
                      {{- end }}
                      {{- if hasKey . "slos" }}
                      - component: {"name": "{{ .name }}-slo", "slo": true}
                      {{- end }}
                      {{- if hasKey . "traffic" }}
                      - component: {"name": "{{ .name }}-traffic", "traffic": true}
                      {{- end }}
          # environments; synthetic traffic skips those that turn it off (trafficScale: 0)
          - list:
              elementsYaml: |
                {{- $traffic := hasKey .component "traffic" }}
                {{- range .environments }}
                {{- if not (and $traffic (hasKey . "trafficScale") (eq (toString .trafficScale) "0")) }}
                - env: {{ toJson . }}
                {{- end }}
                {{- end }}
  syncPolicy:
    preserveResourcesOnDeletion: true   # removing an app.yaml removes its Applications, not (yet) its workloads
  template:
    metadata:
      name: "{{ .component.name }}-{{ .env.name }}"
      namespace: argocd
      labels: { slo-platform/app: "{{ .name }}", slo-platform/env: "{{ .env.name }}" }
    spec:
      project: default
      source:   # the platform's charts; an application's own components: the instance repository (templatePatch)
        repoURL: "${PRODUCT_REPO}"
        targetRevision: "${PRODUCT_VERSION}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .name }}-{{ .env.name }}"
      syncPolicy:
        automated: { prune: true, selfHeal: true }
        syncOptions: [CreateNamespace=true]
        retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
  templatePatch: |
    spec:
      source:
      {{- if hasKey .component "slo" }}
        path: platform/slo
        helm:
          releaseName: "{{ .component.name }}"
          valuesObject: {{ toJson (dict "app" .name "env" .env.name "slos" .slos) }}
      {{- else if hasKey .component "traffic" }}
        {{- $v := dict "app" .name "env" .env.name "requests" .traffic.requests "day" (dict "minutes" ${DAY_MINUTES} "tzOffsetHours" ${TZ_OFFSET_HOURS}) }}
        {{- if hasKey .traffic "peakRpm" }}{{ $_ := set $v "peakRpm" .traffic.peakRpm }}{{ end }}
        {{- if hasKey .env "trafficScale" }}{{ $_ := set $v "scale" .env.trafficScale }}{{ end }}
        path: platform/traffic
        helm:
          releaseName: "{{ .component.name }}"
          valuesObject: {{ toJson $v }}
      {{- else if hasKey .component "helm" }}
        repoURL: "${INSTANCE_REPO}"
        targetRevision: "${INSTANCE_REVISION}"
        path: "{{ .path.path }}/{{ .component.helm }}/chart"
        helm:
          releaseName: "{{ .component.name }}"
          valueFiles: ["../values-{{ .env.name }}.yaml"]
      {{- else }}
        repoURL: "${INSTANCE_REPO}"
        targetRevision: "${INSTANCE_REVISION}"
        path: "{{ .path.path }}/{{ .component.kustomize }}/{{ .env.name }}"
      {{- end }}
      {{- if hasKey . "ignoreDifferences" }}
      ignoreDifferences: {{ toJson .ignoreDifferences }}
      {{- end }}
      syncPolicy:
        {{- if hasKey . "ignoreDifferences" }}
        syncOptions: [CreateNamespace=true, RespectIgnoreDifferences=true]
        {{- end }}
        {{- $own := dict "slo-platform/app" .name "slo-platform/env" .env.name }}
        {{- if and (hasKey . "signedImages") .signedImages }}{{ $_ := set $own "slo-platform/image-signatures" "required" }}{{ end }}
        {{- $ns := dict }}{{ if hasKey . "namespace" }}{{ $ns = .namespace }}{{ end }}
        {{- $labels := merge $own (get $ns "labels" | default dict) ${NAMESPACE_LABELS} }}
        {{- $annotations := merge (dict "chaos-mesh.org/inject" "enabled") (get $ns "annotations" | default dict) ${NAMESPACE_ANNOTATIONS} }}
        managedNamespaceMetadata:   # chaos-mesh.org/inject: fault experiments may target it (platform-chaos-mesh)
          labels: {{ toJson $labels }}
          annotations: {{ toJson $annotations }}
