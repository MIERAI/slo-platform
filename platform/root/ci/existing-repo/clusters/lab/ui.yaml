# An Application of the owner's own (extras-lab deploys it into argocd)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata: { name: platform-ui, namespace: argocd }
spec:
  project: default
  source: { repoURL: https://github.com/your-org/gitops-manifests.git, targetRevision: main, path: platform/ui-lab }
  destination: { server: https://kubernetes.default.svc, namespace: monitoring }
  syncPolicy: { automated: { prune: true, selfHeal: true } }
