{{- if and .Values.optional.policies (include "root.enabled" (list . "policies")) }}
# optional.policies: admission policies for every application namespace (label slo-platform/app). Retries until Kyverno's CRDs exist.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-policies
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-2" }
spec:
  project: default
  source:
    {{- include "root.product" . | nindent 4 }}
    path: platform/policies
  destination:
    server: https://kubernetes.default.svc
    namespace: kyverno
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 10, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
{{- end }}
