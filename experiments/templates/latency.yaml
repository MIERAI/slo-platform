# latency: every pod that exports the SLI fails → SLOMetricAbsent (ticket), not a burn.
# Network delay on the service's own pods does not bite an in-pod histogram: the service times its handler, and the
# delay is added to packets after the response has left it (storefront api-slow-v2/-v3: api-latency stayed quiet while
# api's packets were 300-600ms late; P6's trial on kind: sample-app's packets +750ms for 4 min, the probe took
# 1.5s, the in-pod p99 stayed at 5ms, hello-latency's threshold is 0.25s). Latency shows only where a caller
# times a call that crosses the delayed path — a dependency, hand-written (storefront api-slow-v3). What a generic
# fault can prove: the SLO's histogram and matchers select live series of these pods, and losing them raises the "SLI
# absent" ticket.
# Everything below the line is the experiment; scripts/generate-experiments.py fills the ${...} fields.
---
hypothesis: >-
  Every pod with ${selector_text} fails (pod-failure). These pods export the SLI of ${slo_id}
  (${sli}). With no pod left no request is timed, so the SLO does not burn; its series vanish and SLOMetricAbsent
  (ticket) fires within ${within} (Pyrra's absent rule: for ${absent_for}, in a rule group evaluated
  every 150s; the runner sees such alerts up to ~2.3 min late: storefront-db-unreachable-v2). The SLO itself must not page. Other SLOs
  of ${app} may (a probe of this service, a caller's availability).
namespace: ${namespace}
fault:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: PodChaos
    metadata: { name: ${fault_name} }
    spec:
      action: pod-failure
      mode: all
      selector: { labelSelectors: ${selector} }
      duration: ${duration}
effect:   # the SLI's series are gone
  query: ${effect_query}
  within: 3m
timeout: ${timeout}
expect:
  fire:
    - { alert: SLOMetricAbsent, labels: { namespace: ${namespace}, slo: ${slo_id} }, within: ${within} }
  may_fire: ${may_fire}
recover: 15m
