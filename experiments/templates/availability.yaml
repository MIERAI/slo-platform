# availability: every pod that exports the SLI fails → SLOMetricAbsent (ticket), not a burn.
# An in-pod request counter cannot count requests that never reach a pod: with every pod down the error ratio has no
# data and the SLO does not burn (seen: examples/sample-app/experiments/sample-app-down.yaml; seeing an outage with no
# pod left is the probe SLO's job, docs/concepts.md 4). What a generic fault can prove: the SLO's metric and matchers
# select live series of these pods, and losing them raises the "SLI absent" ticket. The burn path (errors counted by
# the service) needs a fault the application itself reports — a fault switch, hand-written (storefront api-errors).
# Everything below the line is the experiment; scripts/generate-experiments.py fills the ${...} fields.
---
hypothesis: >-
  Every pod with ${selector_text} fails (pod-failure). These pods export the SLI of ${slo_id}
  (${sli}). With no pod left nothing counts the failed requests, so the SLO does not burn; its series vanish and
  SLOMetricAbsent (ticket) fires within ${within} (Pyrra's absent rule: for ${absent_for}, in a rule group evaluated
  every 150s; the runner sees such alerts up to ~2.3 min late: storefront-db-unreachable-v2). The SLO itself must not
  page. Other SLOs of ${app} may (a probe of this service, a caller's availability).
namespace: ${namespace}
fault:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: PodChaos
    metadata: { name: ${fault_name} }
    spec:
      action: pod-failure
      mode: all
      selector: { labelSelectors: ${selector} }
      duration: ${duration}
effect:   # the SLI's series are gone
  query: ${effect_query}
  within: 3m
timeout: ${timeout}
expect:
  fire:
    - { alert: SLOMetricAbsent, labels: { namespace: ${namespace}, slo: ${slo_id} }, within: ${within} }
  may_fire: ${may_fire}
recover: 15m
