# (template experiments/templates/availability.yaml, version 1; what it predicts and why: its comments)
hypothesis: >-
  Every pod with app=sample-app fails (pod-failure). These pods export the SLI of sample-app-hello-availability
  (http_requests_total{app="sample-app", route="GET /hello"}). With no pod left nothing counts the failed requests, so
  the SLO does not burn; its series vanish and SLOMetricAbsent (ticket) fires within 14m (Pyrra's absent rule: for 6m,
  in a rule group evaluated every 150s; the runner sees such alerts up to ~2.3 min late:
  storefront-db-unreachable-v2). The SLO itself must not page. Other SLOs of sample-app may (a probe of this service,
  a caller's availability).
namespace: sample-app-dev
fault:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: PodChaos
    metadata: { name: sample-app-hello-availability-generated }
    spec:
      action: pod-failure
      mode: all
      selector: { labelSelectors: { app: sample-app } }
      duration: 31m
effect:   # the SLI's series are gone
  query: 'absent(http_requests_total{namespace="sample-app-dev", app="sample-app", route="GET /hello"})'
  within: 3m
timeout: 16m
expect:
  fire:
    - { alert: SLOMetricAbsent, labels: { namespace: sample-app-dev, slo: sample-app-hello-availability }, within: 14m }
  may_fire:
    - { alert: ErrorBudgetBurn, labels: { namespace: sample-app-dev, slo: sample-app-hello-latency } }
    - { alert: ErrorBudgetBurn, labels: { namespace: sample-app-dev, slo: sample-app-hello-probe } }
recover: 15m
generated: { from: hello-availability, template: availability, version: 1 }
