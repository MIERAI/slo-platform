# (template experiments/templates/latency.yaml, version 1; what it predicts and why: its comments)
hypothesis: >-
  Every pod with app=sample-app fails (pod-failure). These pods export the SLI of sample-app-hello-latency
  (http_request_duration_seconds_count{app="sample-app", route="GET /hello"}). With no pod left no request is timed,
  so the SLO does not burn; its series vanish and SLOMetricAbsent (ticket) fires within 18m (Pyrra's absent rule: for
  10m, in a rule group evaluated every 150s; the runner sees such alerts up to ~2.3 min late:
  storefront-db-unreachable-v2). The SLO itself must not page. Other SLOs of sample-app may (a probe of this service,
  a caller's availability).
namespace: sample-app-dev
fault:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: PodChaos
    metadata: { name: sample-app-hello-latency-generated }
    spec:
      action: pod-failure
      mode: all
      selector: { labelSelectors: { app: sample-app } }
      duration: 35m
effect:   # the SLI's series are gone
  query: 'absent(http_request_duration_seconds_count{namespace="sample-app-dev", app="sample-app", route="GET /hello"})'
  within: 3m
timeout: 20m
expect:
  fire:
    - { alert: SLOMetricAbsent, labels: { namespace: sample-app-dev, slo: sample-app-hello-latency }, within: 18m }
  may_fire:
    - { alert: ErrorBudgetBurn, labels: { namespace: sample-app-dev, slo: sample-app-hello-availability } }
    - { alert: ErrorBudgetBurn, labels: { namespace: sample-app-dev, slo: sample-app-hello-probe } }
recover: 15m
generated: { from: hello-latency, template: latency, version: 1 }
