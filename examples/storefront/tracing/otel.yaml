# The standard OpenTelemetry environment (storefront internal/obs): OTLP over HTTP to Tempo; the namespace
# (storefront-<env>) as a resource attribute, to tell the environments apart in TraceQL:
#   { resource.k8s.namespace.name = "storefront-dev" && resource.service.name = "web" }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: "http://tempo.tracing.svc:4318" }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: POD_NAMESPACE, valueFrom: { fieldRef: { fieldPath: metadata.namespace } } }
- op: add
  path: /spec/template/spec/containers/0/env/-
  value: { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.namespace.name=$(POD_NAMESPACE)" }
