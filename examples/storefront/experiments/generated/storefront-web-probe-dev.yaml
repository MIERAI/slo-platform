hypothesis: >-
  Every pod behind Service web (app=web) fails (pod-failure). Users get connection errors on /; the blackbox probe
  fails every 15s. Prediction, from the objective: the 1h error ratio reaches 14 × the 0.5% budget after 4.2 min of
  failed probes; with `for: 2m` and 4 min of margin for scrapes, rule evaluation and polling, storefront-web-probe
  pages (fast burn, long 1h) within 11m. Other SLOs of storefront may page too (an outage burns several); in-pod SLIs
