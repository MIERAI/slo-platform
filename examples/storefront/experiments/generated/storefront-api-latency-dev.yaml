# generated by scripts/generate-experiments.py from examples/storefront/app.yaml — edit freely; regenerate with --force
# (template experiments/templates/latency.yaml, version 1; what it predicts and why: its comments)
hypothesis: >-
  Every pod with app=api fails (pod-failure). These pods export the SLI of storefront-api-latency
  (http_request_duration_seconds_count{app="api", route="GET /products"}). With no pod left no request is timed, so
  the SLO does not burn; its series vanish and SLOMetricAbsent (ticket) fires within 18m (Pyrra's absent rule: for
  10m, in a rule group evaluated every 150s; the runner sees such alerts up to ~2.3 min late:
  storefront-db-unreachable-v2). The SLO itself must not page. Other SLOs of storefront may (a probe of this service,
  a caller's availability).
namespace: storefront-dev
fault:
  - apiVersion: chaos-mesh.org/v1alpha1
    kind: PodChaos
    metadata: { name: storefront-api-latency-generated }
    spec:
      action: pod-failure
      mode: all
      selector: { labelSelectors: { app: api } }
      duration: 35m
effect:   # the SLI's series are gone
  query: 'absent(http_request_duration_seconds_count{namespace="storefront-dev", app="api", route="GET /products"})'
  within: 3m
timeout: 20m
expect:
  fire:
    - { alert: SLOMetricAbsent, labels: { namespace: storefront-dev, slo: storefront-api-latency }, within: 18m }
  may_fire:
    - { alert: ErrorBudgetBurn, labels: { namespace: storefront-dev, slo: storefront-web-availability } }
    - { alert: ErrorBudgetBurn, labels: { namespace: storefront-dev, slo: storefront-web-probe } }
    - { alert: ErrorBudgetBurn, labels: { namespace: storefront-dev, slo: storefront-web-latency } }
    - { alert: ErrorBudgetBurn, labels: { namespace: storefront-dev, slo: storefront-api-availability } }
    - { alert: ErrorBudgetBurn, labels: { namespace: storefront-dev, slo: storefront-order-intake } }
    - { alert: ErrorBudgetBurn, labels: { namespace: storefront-dev, slo: storefront-order-freshness } }
    - { alert: ErrorBudgetBurn, labels: { namespace: storefront-dev, slo: storefront-order-completeness } }
recover: 15m
generated: { from: api-latency, template: latency, version: 1 }
