apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: {{ .Release.Namespace }}
  labels: { app.kubernetes.io/part-of: storefront, app: worker }
spec:
  replicas: {{ .Values.replicaCount }}
  selector: { matchLabels: { app: worker } }
  template:
    metadata: { labels: { app.kubernetes.io/part-of: storefront, app: worker } }
    spec:
      securityContext: { runAsNonRoot: true, runAsUser: 65532, runAsGroup: 65532, seccompProfile: { type: RuntimeDefault } }
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ required `image.tag (values-<env>.yaml)` .Values.image.tag }}"
          ports: [{ containerPort: 8080, name: http }, { containerPort: 9090, name: metrics }]   # metrics: PodMonitor storefront
          env:
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: "{{ .Values.database.secret }}", key: uri } }
            - { name: WORK_TIME, value: "{{ .Values.workTime }}" }
            {{- if .Values.tracing.enabled }}
            - { name: OTEL_EXPORTER_OTLP_ENDPOINT, value: {{ .Values.tracing.endpoint | quote }} }
            - name: POD_NAMESPACE
              valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
            - { name: OTEL_RESOURCE_ATTRIBUTES, value: "k8s.namespace.name=$(POD_NAMESPACE)" }
            {{- end }}
          # Probe timeouts tolerate slowness (experiment api-slow-v3): with the default 1s, a 600ms network delay killed every
          # api pod (liveness) and took it out of the Service (readiness) — slowness became an outage. Liveness only detects a
          # stuck process: 5s x 6 (2 min) before a restart.
          readinessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 5, timeoutSeconds: 3 }
          livenessProbe: { httpGet: { path: /healthz, port: http }, periodSeconds: 20, timeoutSeconds: 5, failureThreshold: 6 }
          resources: {{ toJson .Values.resources }}   # toJson: one line, and the template stays valid YAML for yamllint
          securityContext: { allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: { drop: [ALL] } }
