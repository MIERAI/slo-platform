# Optional components, not in the default set (platform/README.md):
#   kyverno + policies   admission baseline for every application namespace (pinned images, resources, readiness
#                        probe, non-root)
#   object-storage       in-cluster S3 (SeaweedFS) for database backups, needs the Secret seaweedfs-s3
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - platform-kyverno.yaml
  - platform-policies.yaml
  - platform-object-storage.yaml
