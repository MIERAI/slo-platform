# Prometheus + Alertmanager + Grafana (kube-prometheus-stack, pinned chart). fullnameOverride kps: other components
# address kps-prometheus / kps-alertmanager by name (Pyrra's API, the experiment runner).
# Apps bring their own PodMonitor / PrometheusRule / dashboard ConfigMap; this only runs the stack.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: platform-monitoring
  namespace: argocd
  annotations: { argocd.argoproj.io/sync-wave: "-1" }
spec:
  project: default
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.17.0
    helm:
      valuesObject:
        fullnameOverride: kps
        # kind and k3s: the control-plane components are not reachable from inside the cluster → no scraping, no
        # false alerts
        kubeEtcd: { enabled: false }
        kubeControllerManager: { enabled: false }
        kubeScheduler: { enabled: false }
        kubeProxy: { enabled: false }
        defaultRules:
          rules: { etcd: false, kubeControllerManager: false, kubeSchedulerAlerting: false, kubeSchedulerRecording: false, kubeProxy: false }
        prometheus:
          prometheusSpec:
            # pick up every PodMonitor / ServiceMonitor / PrometheusRule / Probe in the cluster (apps ship their own)
            serviceMonitorSelectorNilUsesHelmValues: false
            podMonitorSelectorNilUsesHelmValues: false
            ruleSelectorNilUsesHelmValues: false
            probeSelectorNilUsesHelmValues: false   # the probe SLOs (platform/slo → Probe)
            # SLOs use 28-day windows: keep 30 days, on a volume — with 3 days in an emptyDir the "28-day" budgets
            # were computed from 3 days and every restart started every SLO from nothing again.
            retention: 30d
            retentionSize: 8GB     # below the volume: Prometheus drops old blocks before the disk fills
            storageSpec:
              volumeClaimTemplate:
                spec: { accessModes: [ReadWriteOnce], resources: { requests: { storage: 10Gi } } }
            scrapeInterval: 15s
            evaluationInterval: 15s
            resources: { requests: { cpu: 100m, memory: 512Mi }, limits: { memory: 1536Mi } }
        # Series no rule, alert or SLO uses (~half of all series on k3s), so 30 days fit:
        kubeApiServer:
          serviceMonitor:
            metricRelabelings:
              - action: drop   # the chart's default
                regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
                sourceLabels: [__name__, le]
              - action: drop   # size / watch histograms
                regex: apiserver_(request_body_size_bytes|response_sizes|watch_events_sizes|watch_list_duration_seconds|watch_cache_read_wait_seconds)_bucket
                sourceLabels: [__name__]
        kubelet:
          serviceMonitor:
            metricRelabelings:
              - action: drop   # the chart's default
                sourceLabels: [__name__, le]
                regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
              # k3s runs the API server in the kubelet's process: its /metrics repeats what job apiserver already has
              # (~68k series on a small k3s node). A real kubelet (kind) exposes none of these.
              - action: drop
                sourceLabels: [__name__]
                regex: (apiserver|etcd|aggregator|apiextensions|authentication|authorization|watch_cache|field_validation)_.+
        alertmanager:
          alertmanagerSpec:
            resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
          # The default routing policy (docs/concepts.md). Receivers are a slot: "default" is a no-op placeholder
          # until notifications are configured (P3: ntfy, Slack, webhook, email from platform.yaml).
          config:
            route:
              receiver: "null"
              group_by: [alertname, namespace]   # per service, not per SLO: a database outage burns 4 SLOs, one notification
              group_wait: 30s
              group_interval: 5m
              repeat_interval: 12h
              routes:
                # always firing by design (the dead man's switch, P3 sends it to a watcher outside the cluster)
                - { receiver: "null", matchers: ['alertname=~"Watchdog|InfoInhibitor"'] }
                # only prod notifies: dev / staging alerts stay visible in Alertmanager and Grafana. Their low traffic
                # and the fault experiments run there made every short fault page twice (fast burn, then the 6h
                # window after recovery).
                - { receiver: "null", matchers: ['namespace=~".+-(dev|staging)"'] }
                # SLO alerts (page / ticket, platform/slo) notify. The chart's default rules (critical / warning /
                # info) are causes, not symptoms: dashboards only (several false-positive on k3s, where the control
                # plane runs inside one process).
                - { receiver: default, matchers: ['severity=~"page|ticket"'] }
            # one incident, one notification: while an SLO's fast burn (1h window) pages, its medium burn (6h) page
            # and its tickets stay quiet
            inhibit_rules:
              - source_matchers: ['alertname="ErrorBudgetBurn"', 'severity="page"', 'long="1h"']
                target_matchers: ['alertname="ErrorBudgetBurn"', 'severity="page"', 'long="6h"']
                equal: [namespace, slo]
              - source_matchers: ['alertname="ErrorBudgetBurn"', 'severity="page"']
                target_matchers: ['alertname="ErrorBudgetBurn"', 'severity="ticket"']
                equal: [namespace, slo]
            receivers:
              - name: "null"
              - name: default
        grafana:
          # A fixed, well-known admin password (kube-prometheus-stack's long-standing default): the chart's random one
          # changes on every render (Argo CD renders without lookup), and its checksum restarts Grafana in a loop.
          # Grafana is a ClusterIP Service (kubectl port-forward). Before exposing it anywhere: create a Secret and
          # set admin.existingSecret (platform/README.md).
          adminPassword: prom-operator
          sidecar:
            dashboards: { enabled: true, label: grafana_dashboard, searchNamespace: ALL }
          resources: { requests: { cpu: 50m, memory: 192Mi }, limits: { memory: 512Mi } }
          # Grafana needs more than the default 60s to start on a small node: the liveness probe killed it in a loop
          # (exit 137)
          livenessProbe: { httpGet: { path: /api/health, port: 3000 }, initialDelaySeconds: 180, timeoutSeconds: 30, failureThreshold: 10 }
        kube-state-metrics:
          resources: { requests: { cpu: 10m, memory: 32Mi }, limits: { memory: 128Mi } }
        prometheus-node-exporter:
          resources: { requests: { cpu: 10m, memory: 16Mi }, limits: { memory: 64Mi } }
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true, ServerSideApply=true]
    retry: { limit: 5, backoff: { duration: 10s, factor: 2, maxDuration: 3m } }
