# The platform's Applications (app of apps: a root Application renders this directory) and the ApplicationSet that
# turns every app.yaml into Applications. Optional components: apps/optional (a second root, or list them here).
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - applicationset.yaml          # every app.yaml → its Applications
  - platform-argo-rollouts.yaml  # progressive delivery (canary + analysis)
  - platform-blackbox.yaml       # probes from outside the pods (probe SLOs)
  - platform-cert-manager.yaml   # certificates for Chaos Mesh's webhook and CloudNativePG's plugin
  - platform-chaos-mesh.yaml     # fault injection for the SLO experiments
  - platform-cnpg.yaml           # PostgreSQL operator (+ backups) for applications with databases
  - platform-experiments.yaml    # the daily experiment regression (lab clusters only)
  - platform-monitoring.yaml     # Prometheus, Alertmanager (default routing), Grafana
  - platform-pyrra.yaml          # SLOs (app.yaml slos → platform/slo chart → Pyrra)
