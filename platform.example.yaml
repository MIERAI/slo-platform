# platform.yaml of an instance repository (apiVersion slo-platform/v1; reference: docs/configuration.md).
# `bin/slo-platform init` writes one like this; `slo-platform check` validates it; it is also the values of the
# platform's root chart (platform/root), which Argo CD renders once per cluster.
apiVersion: slo-platform/v1

product:                           # the platform: this repository at a version
  repo: https://github.com/MIERAI/slo-platform.git
  version: main                    # a git tag or branch; upgrade = change it (`slo-platform upgrade --version <ref>`)

instance:                          # your instance repository: apps/*/app.yaml, their manifests and experiments
  repo: https://github.com/your-org/slo-instance.git
  revision: main

timezone: Etc/UTC                  # IANA name: the regression's schedule, quiet hours, the synthetic users' day
language: en                       # en | zh | ja (notification texts)

clusters:                          # one root Application per cluster; bootstrap one cluster at a time by its name
  lab:
    role: lab                      # experiments + the daily regression; notifies nobody
    runtime: kind                  # kind | k3s | generic (Chaos Mesh's container runtime socket)
    objectStorage: none            # none | in-cluster (an S3-compatible store for database backups)
  prod:
    role: prod                     # notifies; never runs experiments
    runtime: k3s
    objectStorage: in-cluster

optional:
  policies: false                  # Kyverno + the workload baseline (admission policies)

grafana:
  adminSecret: grafana-admin       # Secret in monitoring with admin-user, admin-password (created by bootstrap)

regression:
  schedule: "0 9 * * *"            # the daily fault regression on lab clusters, in `timezone`

traffic:
  dayMinutes: 1440                 # the synthetic users' day; less compresses it (60: one day per hour, for tests)

notify: {}                         # who hears what: P3 (accepted and ignored for now)
