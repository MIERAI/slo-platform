# platform.yaml of an instance repository (apiVersion slo-platform/v1; reference: docs/configuration.md).
# `bin/slo-platform init` writes one like this; `slo-platform check` validates it; it is also the values of the
# platform's root chart (platform/root), which Argo CD renders once per cluster.
apiVersion: slo-platform/v1

product:                           # the platform: this repository at a version
  repo: https://github.com/MIERAI/slo-platform.git
  version: main                    # a git tag or branch; upgrade = change it (`slo-platform upgrade --version <ref>`)

instance:                          # your instance repository: apps/*/app.yaml, their manifests and experiments
  repo: https://github.com/your-org/slo-instance.git
  revision: main
  # apps: apps                     # where <app>/app.yaml directories live; "." = the repository root (an existing repo)

timezone: Etc/UTC                  # IANA name: the regression's schedule, quiet hours, the synthetic users' day
language: en                       # en | zh | ja (notification texts)

clusters:                          # one root Application per cluster; bootstrap one cluster at a time by its name
  lab:
    role: lab                      # experiments + the daily regression; notifies nobody
    runtime: kind                  # kind | k3s | generic (Chaos Mesh's container runtime socket)
    objectStorage: none            # none | in-cluster (an S3-compatible store for database backups)
  prod:
    role: prod                     # notifies; never runs experiments
    runtime: k3s
    objectStorage: in-cluster
    # extras:                      # your own components: Application extras-<name> from this repository's <path>
    #   - { name: mine, path: clusters/prod }

optional:
  policies: false                  # Kyverno + the workload baseline (admission policies)

# applications:                    # metadata of every application namespace (app.yaml namespace: adds / overrides)
#   namespaceLabels: { example.com/policies: enforced }
#   namespaceAnnotations: {}

# components:                      # per platform component: enabled (default true); Helm-sourced ones also values,
#   monitoring:                    # deep-merged into its Helm values (maps merge, lists replace)
#     values: { prometheus: { prometheusSpec: { retentionSize: 12GB } } }
#   cnpg: { enabled: false }
#   tracing:                       # opt-in: a Grafana datasource for an external Tempo (docs/configuration.md#tracing)
#     enabled: true
#     external: { queryUrl: "http://tempo.example:3200", endpoint: "http://tempo.example:4318" }

grafana:
  adminSecret: grafana-admin       # Secret in monitoring with admin-user, admin-password (created by bootstrap)

regression:
  schedule: "0 9 * * *"            # the daily fault regression on lab clusters, in `timezone`
  # experiments: experiments       # its experiment directories (globs); default <instance.apps>/*/experiments

traffic:
  dayMinutes: 1440                 # the synthetic users' day; less compresses it (60: one day per hour, for tests)

notify:                            # who hears what on prod clusters (docs/configuration.md#notify); {}: nobody
  page:                            # every page (an SLO burning fast) to each of these
    - { type: ntfy, topic: my-team-pages-7f3a9c }        # https://ntfy.sh/my-team-pages-7f3a9c: a long random name
    - { type: telegram, chatId: "-1001234567890" }       # bot token: secrets file notify.telegramBotToken
  ticket:                          # every ticket (budget eroding slowly, an SLI gone)
    - { type: email, to: ops@example.com, from: alertmanager@example.com, smarthost: "smtp.example.com:587", username: alertmanager }
  deadman: { url: https://hc-ping.com/your-check-uuid, interval: 1m }   # optional: a watcher outside the cluster
