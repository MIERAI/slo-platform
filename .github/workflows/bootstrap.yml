# bootstrap/tofu: formatting and a static validation of every root (no cluster, no backend, no secrets)
name: bootstrap
on:
  pull_request:
    paths: [bootstrap/**, .github/workflows/bootstrap.yml]
  push:
    branches: [main]
    paths: [bootstrap/**, .github/workflows/bootstrap.yml]
  workflow_dispatch:
permissions: { contents: read }
env:
  TOFU_VERSION: 1.13.9
jobs:
  tofu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v2
        with: { tofu_version: "${{ env.TOFU_VERSION }}", tofu_wrapper: false }
      - name: fmt
        run: tofu fmt -check -recursive -diff bootstrap/tofu
      - name: init + validate (kind, cluster)
        run: |
          for r in kind cluster; do
            echo "── $r"
            tofu -chdir=bootstrap/tofu/$r init -backend=false -input=false -lockfile=readonly >/dev/null
            tofu -chdir=bootstrap/tofu/$r validate
          done
