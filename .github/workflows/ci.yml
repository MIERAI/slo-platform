name: ci
on:
  pull_request:
  push: { branches: [main] }
permissions: { contents: read }
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: YAML
        run: pipx run yamllint .
      - name: Shell
        run: shellcheck scripts/*.sh
      - name: No personal values
        run: scripts/check-residue.sh
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo scripts/install-tools.sh
      - name: Render and validate (scripts/validate.sh)
        run: scripts/validate.sh
  notify-delivery:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: sudo scripts/install-tools.sh
      - name: Notifications reach local receivers (scripts/notify-delivery.sh)
        run: scripts/notify-delivery.sh
